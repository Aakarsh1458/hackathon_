name: emotion_engine
description: Isolated emotion and signal engine (camera, ML Kit, journal, timeline).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.11.1
  google_mlkit_commons: ^0.8.1
  path_provider: ^2.1.4
  path: ^1.9.0
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
